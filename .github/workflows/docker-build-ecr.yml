name: "Docker build & push to ECR"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to build'
        type: string
        required: true
      branch_name:
        description: 'Branch name'
        type: string
        required: true
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      branch_name:
        required: true
        type: string
    outputs:
      image_version:
        value: ${{ jobs.calculate_version.outputs.image_version }}
      ecr_image:
        value: ${{ jobs.build_and_push.outputs.ecr_image }}

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 767397759867.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: label-studio

jobs:
  calculate_version:
    name: "Calculate version"
    runs-on: label-studio-rss
    outputs:
      image_version: ${{ steps.version.outputs.image_version }}
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1

      - name: Calculate version
        id: version
        run: |
          sha="${{ inputs.sha }}"
          branch="${{ inputs.branch_name }}"
          short_sha="$(echo $sha | cut -c1-7)"
          timestamp="$(date +'%Y%m%d.%H%M%S')"

          # Map branch names to image tags
          if [[ "$branch" == "feat/polygon-preview-line" ]]; then
            image_version="glidance_v1"
          elif [[ "$branch" == "glidance" ]]; then
            image_version="glidance_v2"
          else
            image_version="$(echo -n "${branch#refs/heads/}" | sed -E 's#[/_\.-]+#-#g' | tr '[:upper:]' '[:lower:]' | cut -c1-25)"
          fi

          echo "image_version=${image_version}" >> $GITHUB_OUTPUT
          echo "build_version=${timestamp}-${image_version}-${short_sha}" >> $GITHUB_OUTPUT

  build_and_push:
    name: "Build & Push"
    runs-on: label-studio-rss
    timeout-minutes: 60
    needs: calculate_version
    outputs:
      ecr_image: ${{ steps.output.outputs.ecr_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          ref: ${{ inputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.calculate_version.outputs.image_version }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.calculate_version.outputs.build_version }}
          build-args: |
            VERSION_OVERRIDE=${{ needs.calculate_version.outputs.build_version }}

      - name: Output image
        id: output
        run: |
          echo "ecr_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.calculate_version.outputs.build_version }}" >> $GITHUB_OUTPUT
